<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quick Note Taker</title>
    <style>
        :root {
            --bg: #f4f4f4;
            --text: #333;
            --textarea-bg: white;
            --btn-bg: #316357;
            --btn-text: white;
        }
        body.dark-mode {
            --bg: #1e1e1e;
            --text: #f4f4f4;
            --textarea-bg: #2d2d2d;
            --btn-bg: #4a907e;
        }
        body {
            font-family: system-ui;
            padding: 20px;
            background: var(--bg);
            color: var(--text);
            transition: all 0.3s;
        }
        textarea {
            width: 100%;
            height: 60vh;
            font-size: 18px;
            padding: 15px;
            box-sizing: border-box;
            background: var(--textarea-bg);
            color: var(--text);
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover { opacity: 0.9; }
        button.delete { background: #a94442; }
        
        #save_status { font-size: 14px; color: #666; margin-bottom: 10px; }
        .stats { font-size: 12px; color: #888; margin-top: 10px; }

        /* Modal */
        #trash-modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--textarea-bg);
            padding: 20px;
            border: 1px solid #ccc;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            width: 500px;
            z-index: 1000;
        }
        #modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }
        #trash-list { list-style: none; padding: 0; max-height: 300px; overflow-y: auto; }
        #trash-list li {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px; border-bottom: 1px solid #444;
        }

        /* 
           CHANGE: Added @media print styles to ensure that when exporting to PDF or Printing, 
           only the text inside the editor is shown. All buttons, titles, and status bars are hidden.
        */
        @media print {
            /* Hide everything by default */
            body * { visibility: hidden; }
            /* Only show the note textarea and make it fill the page */
            #note, #note * { 
                visibility: visible; 
                border: none !important; 
                position: absolute; 
                left: 0; 
                top: 0; 
                width: 100%; 
                height: 100%; 
            }
        }
    </style>
</head>
<body>
    <h1>📝 Quick Note Taker</h1>
    <p id="save_status">Auto save status</p>
    
    <textarea id="note" placeholder="Start typing your note..."></textarea>
    
    <div class="stats">
        <span id="char-count">0 chars</span> | <span id="word-count">0 words</span>
    </div>

    <div class="controls">
        <button id="new-note">📰 New Note</button>
        <button id="open-file">📂 Open File</button>
        <button id="save">💾 Save </button>
        <button id="print">🖨️ Print</button>
        <button id="export-pdf">📄 PDF</button>
        <button id="delete-note" class="delete">🗑️ Move to Trash</button>
        <button id="trash-bin">♻️ Trash Bin</button>
    </div>

    <div id="modal-overlay"></div>
    <div id="trash-modal">
        <h2>♻️ Trash Bin</h2>
        <ul id="trash-list"></ul>
        <button id="close-trash">Close</button>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
